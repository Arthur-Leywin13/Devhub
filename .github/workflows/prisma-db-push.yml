name: Sync Prisma Database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/prisma/schema.prisma'
      - '.github/workflows/prisma-db-push.yml'

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Create user settings table without altering existing tables
        working-directory: backend
        run: |
          cat <<'SQL' | npx prisma db execute --stdin --schema prisma/schema.prisma
          CREATE TABLE IF NOT EXISTS "user_settings" (
            "id" UUID NOT NULL DEFAULT gen_random_uuid(),
            "user_id" UUID NOT NULL,
            "preferences" JSONB NOT NULL DEFAULT '{}'::jsonb,
            "updated_at" TIMESTAMP(3) NOT NULL,
            CONSTRAINT "user_settings_pkey" PRIMARY KEY ("id"),
            CONSTRAINT "user_settings_user_id_key" UNIQUE ("user_id"),
            CONSTRAINT "user_settings_user_id_fkey"
              FOREIGN KEY ("user_id") REFERENCES "users"("id")
              ON DELETE CASCADE ON UPDATE CASCADE
          );
          SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
